services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sql
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
        - "1433:1433"
    volumes:
        - sql_data:/var/opt/mssql
    healthcheck:
        test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 20s
  init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sql_init
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    depends_on:
      db: 
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - sql_data:/var/opt/mssql
    entrypoint: ["/bin/bash", "/scripts/restore-adventureworks.sh"]
    restart: "no"

volumes:
  sql_data: 
  