  - id: q31
    question: Show monthly internet sales in 2013 compared to 2012.
    # Known failure from testing: the model returned identical numbers in both year columns.
    sql: |
      SELECT D.MonthNumberOfYear,
             SUM(CASE WHEN D.CalendarYear = 2012 THEN F.SalesAmount ELSE 0 END) AS Sales2012,
             SUM(CASE WHEN D.CalendarYear = 2013 THEN F.SalesAmount ELSE 0 END) AS Sales2013
      FROM FactInternetSales F
      INNER JOIN DimDate D ON F.OrderDateKey = D.DateKey
      WHERE D.CalendarYear IN (2012, 2013)
      GROUP BY D.MonthNumberOfYear
      ORDER BY D.MonthNumberOfYear
    ordered: false
    tags: [join, time, seen]

