    sql: |
      SELECT COUNT(DISTINCT F.SalesOrderNumber) AS Orders
      FROM FactInternetSales F
      INNER JOIN DimDate D ON F.ShipDateKey = D.DateKey
      WHERE D.CalendarYear = 2013 AND D.MonthNumberOfYear = 1
