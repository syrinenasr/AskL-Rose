# Test questions for the AskL-Rose evaluation.
# Each reference sql was run once by hand and checked.
#
# Fields:
#   id        q01, q02, ...
#   question  in plain English, the way a user would type it
#   sql       a reference query (one correct answer, not the only one); null for messages that aren't data questions
#   ordered   true only if the question explicitly asks for a sorted or ranked answer.
#   tags      what the question tests: easy, join, time, semantic, not-data, seen
#
# Template:
#
#  - id: q01
#    question: ...
#    sql: |
#      SELECT ...
#    ordered: false
#    tags: [join, time]

questions:
  - id: q01
    question: What were the internet sales for each year?
    sql: |
      SELECT D.CalendarYear, SUM(F.SalesAmount) AS InternetSales
      FROM FactInternetSales F
      INNER JOIN DimDate D ON F.OrderDateKey = D.DateKey
      GROUP BY D.CalendarYear
      ORDER BY D.CalendarYear
    ordered: false
    tags: [join, time]

  - id: q02
    question: Who was the first employee hired?
    sql: |
      SELECT TOP 1 WITH TIES FirstName, LastName
      FROM DimEmployee
      WHERE Status = 'Current'
      ORDER BY HireDate
    ordered: false
    tags: [easy, other-area]

  - id: q03
    question: Who is the employee with the most sales every year?
    sql: |
      WITH yearly AS (
        SELECT D.CalendarYear, E.FirstName, E.LastName, SUM(F.SalesAmount) AS ResellerSales,
               RANK() OVER (PARTITION BY D.CalendarYear ORDER BY SUM(F.SalesAmount) DESC) AS rnk
        FROM FactResellerSales F
        INNER JOIN DimEmployee E ON F.EmployeeKey = E.EmployeeKey
        INNER JOIN DimDate D ON F.OrderDateKey = D.DateKey
        GROUP BY D.CalendarYear, E.EmployeeKey, E.FirstName, E.LastName
      )
      SELECT CalendarYear, FirstName, LastName
      FROM yearly
      WHERE rnk = 1
      ORDER BY CalendarYear
    ordered: false
    tags: [join, time, other-area]

  - id: q04
    question: Which salespeople met their sales quota in 2011?
    sql: |
      WITH quota AS (
        SELECT EmployeeKey, SUM(SalesAmountQuota) AS Quota
        FROM FactSalesQuota
        WHERE CalendarYear = 2011
        GROUP BY EmployeeKey
      ),
      sales AS (
        SELECT F.EmployeeKey, SUM(F.SalesAmount) AS Sales
        FROM FactResellerSales F
        INNER JOIN DimDate D ON F.OrderDateKey = D.DateKey
        WHERE D.CalendarYear = 2011
        GROUP BY F.EmployeeKey
      )
      SELECT E.FirstName, E.LastName
      FROM quota q
      INNER JOIN sales s ON s.EmployeeKey = q.EmployeeKey
      INNER JOIN DimEmployee E ON E.EmployeeKey = q.EmployeeKey
      WHERE s.Sales >= q.Quota
    ordered: false
    tags: [join, time, other-area]

  - id: q05
    question: Can you write me a short poem about bikes?
    sql: null
