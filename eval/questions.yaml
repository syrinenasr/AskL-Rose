  - id: q44
    question: What were the actual travel lodging expenses per department group in 2012?
    # Account Travel Lodging; scenario Actual (not Budget). The parent account Travel Expenses has no rows of its own.
    sql: |
      SELECT G.DepartmentGroupName, SUM(F.Amount) AS TravelExpenses
      FROM FactFinance F
      INNER JOIN DimAccount A ON F.AccountKey = A.AccountKey
      INNER JOIN DimScenario S ON F.ScenarioKey = S.ScenarioKey
      INNER JOIN DimDepartmentGroup G ON F.DepartmentGroupKey = G.DepartmentGroupKey
      INNER JOIN DimDate D ON F.DateKey = D.DateKey
      WHERE A.AccountDescription = 'Travel Lodging' AND S.ScenarioName = 'Actual' AND D.CalendarYear = 2012
      GROUP BY G.DepartmentGroupName
    ordered: false
    tags: [join, time, other-area]

