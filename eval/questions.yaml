  - id: q36
    question: By what percentage did reseller sales grow from 2012 to 2013?
    sql: |
      SELECT 100.0 * (SUM(CASE WHEN D.CalendarYear = 2013 THEN F.SalesAmount END)
                   - SUM(CASE WHEN D.CalendarYear = 2012 THEN F.SalesAmount END))
             / SUM(CASE WHEN D.CalendarYear = 2012 THEN F.SalesAmount END) AS GrowthPercent
      FROM FactResellerSales F
      INNER JOIN DimDate D ON F.OrderDateKey = D.DateKey
      WHERE D.CalendarYear IN (2012, 2013)
    ordered: false
    tags: [join, time]

