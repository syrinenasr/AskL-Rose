    tags: [not-data]

  - id: q06
    question: Who is the most loyal customer?
    # "Loyal" = most separate orders. Spending, time span or first purchase each give a different customer.
    sql: |
      SELECT TOP 1 WITH TIES C.FirstName, C.LastName
      FROM FactInternetSales F
      INNER JOIN DimCustomer C ON F.CustomerKey = C.CustomerKey
      GROUP BY F.CustomerKey, C.FirstName, C.LastName
      ORDER BY COUNT(DISTINCT F.SalesOrderNumber) DESC
    ordered: false
    tags: [join, semantic, ambiguous]

  - id: q07
    question: What was the online profit for each product category in 2013?
    sql: |
      SELECT C.EnglishProductCategoryName AS Category,
             SUM(F.SalesAmount) - SUM(F.TotalProductCost) AS Profit
      FROM FactInternetSales F
      INNER JOIN DimProduct P ON F.ProductKey = P.ProductKey
      INNER JOIN DimProductSubcategory S ON P.ProductSubcategoryKey = S.ProductSubcategoryKey
      INNER JOIN DimProductCategory C ON S.ProductCategoryKey = C.ProductCategoryKey
      INNER JOIN DimDate D ON F.OrderDateKey = D.DateKey
      WHERE D.CalendarYear = 2013
      GROUP BY C.EnglishProductCategoryName
    ordered: false
    tags: [join, time, semantic]

  - id: q08
    question: Which products currently have the highest list price?
    # Without "currently", the answer is Road-150 Red (3,578.27), which is discontinued.
    sql: |
      SELECT TOP 1 WITH TIES EnglishProductName
      FROM DimProduct
      WHERE Status = 'Current'
      ORDER BY ListPrice DESC
    ordered: false
    tags: [easy, history]


  - id: q09
