    tags: [semantic]

  - id: q24
    question: Which city has the most online customers?
    # Group by city and country: several countries can have a city with the same name.
    sql: |
      SELECT TOP 1 WITH TIES G.City
      FROM FactInternetSales F
      INNER JOIN DimCustomer C ON F.CustomerKey = C.CustomerKey
      INNER JOIN DimGeography G ON C.GeographyKey = G.GeographyKey
      GROUP BY G.City, G.EnglishCountryRegionName
      ORDER BY COUNT(DISTINCT F.CustomerKey) DESC
    ordered: false
    tags: [join, semantic]

  - id: q25
    question: Which promotion brought in the most reseller revenue, apart from No Discount?
    sql: |
      SELECT TOP 1 WITH TIES P.EnglishPromotionName
      FROM FactResellerSales F
      INNER JOIN DimPromotion P ON F.PromotionKey = P.PromotionKey
      WHERE P.EnglishPromotionName <> 'No Discount'
      GROUP BY P.EnglishPromotionName
      ORDER BY SUM(F.SalesAmount) DESC
    ordered: false
    tags: [join, other-area]

  - id: q26
    question: What is the most common reason customers give for buying online?
    # Count orders per reason; one order can give several reasons.
    sql: |
      SELECT TOP 1 WITH TIES R.SalesReasonName
      FROM FactInternetSalesReason S
      INNER JOIN DimSalesReason R ON S.SalesReasonKey = R.SalesReasonKey
      GROUP BY R.SalesReasonName
      ORDER BY COUNT(DISTINCT S.SalesOrderNumber) DESC
    ordered: false
    tags: [join, other-area]

  - id: q27
    question: How many customers bought both a bike and a helmet?
    # Known failure from testing: the model returned 0.
    sql: |
      SELECT COUNT(*) AS Customers
      FROM (
        SELECT F.CustomerKey
        FROM FactInternetSales F
        INNER JOIN DimProduct P ON F.ProductKey = P.ProductKey
        INNER JOIN DimProductSubcategory S ON P.ProductSubcategoryKey = S.ProductSubcategoryKey
        INNER JOIN DimProductCategory C ON S.ProductCategoryKey = C.ProductCategoryKey
        GROUP BY F.CustomerKey
        HAVING SUM(CASE WHEN C.EnglishProductCategoryName = 'Bikes' THEN 1 ELSE 0 END) > 0
           AND SUM(CASE WHEN S.EnglishProductSubcategoryName = 'Helmets' THEN 1 ELSE 0 END) > 0
      ) both_bought
    ordered: false
    tags: [join, semantic, seen]

